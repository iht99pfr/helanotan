        - heading "Så fungerar beräkningen" [level=2] [ref=f2e99]
        - paragraph [ref=f2e100]: Köp- och säljpris predikteras med multivariat regression baserad på bilålder, miltal, bränsle, hästkrafter, utrustning, drivlina och säljartyp. Miltalet föreslås automatiskt baserat på medianen bland verkliga annonser för vald modell och årsmodell.
        - paragraph [ref=f2e101]: Driftskostnader (försäkring, service, reparation, skatt) varierar med bilens ålder och modell. Service är normalt inkluderat de första 3 åren, och reparationskostnader ökar med bilens ålder — mer för premiumbilar. 95% konfidensintervall beräknas från regressionens residualfel.
