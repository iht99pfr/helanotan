        - heading "Metod" [level=2] [ref=e115]
        - paragraph [ref=e116]: 29 486 annonser från Blocket.se analyserade, varav 13 063 till salu just nu. Senast uppdaterad 5 augusti 2026. Annonser med priser under 20 000 kr eller årsmodeller före 2005 exkluderas.
        - paragraph [ref=e117]: "Värdeminskning modelleras med log-transformerad multivariat regression med 20 variabler: bilålder, miltal, hästkrafter, utrustningsantal, bränsletyp (Hybrid/Laddhybrid/Diesel/El), säljartyp, drivlina, WLTP-räckvidd samt interaktionstermer mellan bränsletyp och ålder/miltal. Log-transformen ger en naturlig exponentiell avskrivningskurva där nya bilar tappar mer i värde än äldre."
        - paragraph [ref=e118]: 95% prediktionsintervall beräknas i log-rummet (±1,96 × SE) och transformeras tillbaka, vilket ger proportionella konfidensband. Ägandekostnadsberäknaren använder förberäknade prediktionskurvor för att fånga den icke-linjära värdeminskningen vid olika åldrar.
