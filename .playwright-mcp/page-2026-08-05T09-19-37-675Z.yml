      - generic [ref=f1e104]:
        - heading "Metod" [level=2] [ref=f1e105]
        - paragraph [ref=f1e106]: 29 486 annonser från Blocket.se analyserade, varav 13 063 till salu just nu. Senast uppdaterad 4 augusti 2026. Annonser med priser under 20 000 kr eller årsmodeller före 2005 exkluderas.
        - paragraph [ref=f1e107]: "Värdeminskning modelleras med log-transformerad multivariat regression med 20 variabler: bilålder, miltal, hästkrafter, utrustningsantal, bränsletyp (Hybrid/Laddhybrid/Diesel/El), säljartyp, drivlina, WLTP-räckvidd samt interaktionstermer mellan bränsletyp och ålder/miltal. Log-transformen ger en naturlig exponentiell avskrivningskurva där nya bilar tappar mer i värde än äldre."
        - paragraph [ref=f1e108]: 95% prediktionsintervall beräknas i log-rummet (±1,96 × SE) och transformeras tillbaka, vilket ger proportionella konfidensband. Ägandekostnadsberäknaren använder förberäknade prediktionskurvor för att fånga den icke-linjära värdeminskningen vid olika åldrar.
