        - heading "Metod" [level=2] [ref=e75]
        - paragraph [ref=e76]: Data insamlades från Blocket.se i februari 2026. Annonser med priser under 20 000 kr eller årsmodeller före 2005 exkluderades.
        - paragraph [ref=e77]: "Värdeminskning modelleras med log-transformerad multivariat regression med 15 variabler: bilålder, miltal, hästkrafter, utrustningsantal, bränsletyp (Hybrid/Laddhybrid/Diesel/El), säljartyp, drivlina, WLTP-räckvidd samt interaktionstermer mellan bränsletyp och ålder/miltal. Log-transformen ger en naturlig exponentiell avskrivningskurva där nya bilar tappar mer i värde än äldre."
        - paragraph [ref=e78]: 95% prediktionsintervall beräknas i log-rummet (±1,96 × SE) och transformeras tillbaka, vilket ger proportionella konfidensband. Ägandekostnadsberäknaren använder förberäknade prediktionskurvor för att fånga den icke-linjära värdeminskningen vid olika åldrar.
