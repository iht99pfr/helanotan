        - heading "Metod" [level=2] [ref=f4e390]
        - paragraph [ref=f4e391]: 29 486 annonser från Blocket.se analyserade, varav 13 063 till salu just nu. Senast uppdaterad 6 augusti 2026. Annonser med priser under 20 000 kr eller årsmodeller före 2005 exkluderas.
        - paragraph [ref=f4e392]: "Värdeminskning modelleras med log-transformerad multivariat regression med 20 variabler: bilålder, miltal, hästkrafter, utrustningsantal, bränsletyp, säljartyp, drivlina, WLTP-räckvidd samt interaktionstermer mellan bränsletyp och ålder eller miltal. Log-transformen ger en naturlig exponentiell avskrivningskurva där nya bilar tappar mer i värde än äldre."
